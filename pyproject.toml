[project]
name = "companion"
version = "0.1.0"
description = "Multi-user, voice-first AI companion (see docs/ai-companion-mvp-build-spec.md)"
requires-python = ">=3.11"
dependencies = [
    "authlib>=1.7.2",
    "fastapi>=0.139.0",
    "fastapi-mail>=1.6.5",
    "fastembed>=0.8.0",
    "faster-whisper>=1.2.1",
    "graphiti-core>=0.29.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "langfuse>=4.13.1",
    "langgraph>=1.2.8",
    "mem0ai>=2.0.11",
    "neo4j>=6.2.0",
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymongo>=4.17.0",
    "qdrant-client>=1.18.0",
    "redis>=8.0.1",
    "uvicorn[standard]>=0.50.2",
    "websockets>=15",
]

[project.optional-dependencies]
voice = [
    "pipecat-ai[silero]>=1.5.0",
]
# SER GPU microservice deps (spec §22) — installed only on the GPU box that
# runs services/ser_service, never in the core app / CI env.
ser = [
    "funasr>=1.2.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "import-linter>=2.13",
    "mypy>=2.1.0",
    "playwright>=1.61.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

# ── Tooling ──────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "ASYNC", # flake8-async (the codebase is async-first, spec §0.5)
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["config", "core", "ports", "adapters", "voice", "workers", "api", "services", "tests"]

[tool.importlinter]
root_packages = ["core", "ports", "adapters", "api", "voice", "workers", "config", "services"]

[[tool.importlinter.contracts]]
name = "core/ must never import adapters/ (hexagonal boundary, design doc §17.2)"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["adapters"]

[[tool.importlinter.contracts]]
name = "ports/ are pure interfaces — no core/adapters/api imports"
type = "forbidden"
source_modules = ["ports"]
forbidden_modules = ["core", "adapters", "api", "voice", "workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "integration: needs real datastores from docker-compose (Mongo/Qdrant/Neo4j/Redis)",
    "acceptance: end-to-end acceptance-criteria tests",
    "paid: hits a real paid provider (needs an API key); skipped loudly without one",
    "real_call: real model + real stores end-to-end (no mocks), LLM-judged; needs keys + docker",
]

[tool.coverage.run]
source = ["config", "core", "ports", "adapters", "voice", "workers", "api", "services"]
