# Per-IP request rate limit for the companion site (http context → /etc/nginx/conf.d/).
# Throttles scanners/floods; generous enough that a real page load (a handful of
# requests) never trips it. Applied via `limit_req` in `location /` of companion.conf;
# deliberately NOT applied to /ws/voice (a long-lived WebSocket must not be throttled).
# Installed by deploy/install-nginx.sh. See docs/DEPLOYMENT.md §11 (Security hardening).
limit_req_zone $binary_remote_addr zone=companion:10m rate=20r/s;
limit_req_status 429;
