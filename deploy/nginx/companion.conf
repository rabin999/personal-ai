# Personal AI Companion - reverse proxy for the FastAPI serving edge.
# Fronts uvicorn (bound to 127.0.0.1:8000). This template ships the plain :80
# server block; TLS on :443 is added by deploy/enable-https.sh (certbot --nginx),
# which injects the 443 server + a :80->:443 redirect in place. See docs/DEPLOYMENT.md.
#
# server_name is the sslip.io hostname so Let's Encrypt (certbot --nginx) can
# match -d 202-58-120-93.sslip.io. sslip.io maps a-b-c-d.sslip.io -> a.b.c.d,
# giving a real trusted cert without owning a domain.

# Map the Upgrade request header to the correct Connection value so both
# normal HTTP and the /ws/voice WebSocket upgrade work through one server block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 202-58-120-93.sslip.io;

    # Chat path can carry base64 audio; keep generous but bounded.
    client_max_body_size 25m;

    # WebSocket voice stream - must upgrade and stay open for the audio session.
    location /ws/voice {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # SPA (/), hashed /assets/*, /pcm-worklet.js, /health, /api/* - everything else.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
